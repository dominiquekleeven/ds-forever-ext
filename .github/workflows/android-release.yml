name: Android test release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after all build and test gates pass
        type: boolean
        default: false
  push:
    tags: ['v*-ext.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Install pinned Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Build pinned runtime prerequisites
        run: bash tools/ci_bootstrap.sh
      - name: Test drivers and independent FPS measurements
        env:
          TRADE_SHOTS_DIR: ${{ runner.temp }}/ds-ext-menu-shots
          ADDON_TILES_SHOTS_DIR: ${{ runner.temp }}/ds-ext-menu-shots
          BOTTOM_ROUTE_SHOTS_DIR: ${{ runner.temp }}/ds-ext-menu-shots
        run: |
          bash gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testModernDebugUnitTest --tests '*WowGpuDriversTest' --tests '*OutputFpsTest' \
            --tests '*GameFpsTest' --tests '*FpsCounterTest' --tests '*PerformanceTilesRoomTest' \
            --tests '*GpuDriverMenuUiTest' --tests '*WowGpuDriverControllerTest' --tests '*StartMenuShotsTest' \
            --tests '*AddonTilesRoomTest.navigationUsesTheExistingCardAndCanBeRemovedWithoutChangingQuestie' \
            --tests '*BottomRouteShotsTest' \
            --tests '*KeyboardRepeatShiftTest' --tests '*XInputQueueTest' --tests '*XInputHoldTest' --tests '*XInputWiringTest' \
            --tests '*GameSessionServiceTest' --tests '*WowLaunchSwitchTest' --tests '*FirstRunArtTest' \
            --tests '*CrashStateLineTest' --tests '*WowCdnStreamTest' --tests '*HomeMapControlsShotsTest'
      - name: Test Questie replacement and Ext update channel
        if: ${{ !cancelled() }}
        env:
          QUESTIE_BUNDLE_ZIP: ${{ runner.temp }}/questie-bundle.zip
          QUESTIEDB_FOREVER_ZIP: ${{ runner.temp }}/questiedb-forever.zip
          SHORTEST_PATH_FOREVER_ZIP: ${{ runner.temp }}/shortest-path-forever.zip
        run: |
          curl --fail --location --retry 3 --output "$QUESTIE_BUNDLE_ZIP" \
            'https://github.com/Questie/Questie/releases/download/bundle%2Fv12.12.0%2Bv1.1.4/Questie-v12.12.0%2Bv1.1.4.zip'
          curl --fail --location --retry 3 --output "$QUESTIEDB_FOREVER_ZIP" \
            'https://github.com/Questie/QuestieDB/releases/download/v1.1.4/QuestieDB-1.1.4-Forever.zip'
          echo "116eadd5833836d1b8ff30c9c8b5aaf724bc2de75eea362d6eee3d9962506b5f  $QUESTIE_BUNDLE_ZIP" | sha256sum --check
          echo "77560ed5a425de989b45bbaddb3fd0eb2173df25f43c4d5c3ef8b4622985486c  $QUESTIEDB_FOREVER_ZIP" | sha256sum --check
          curl --fail --location --retry 3 --output "$SHORTEST_PATH_FOREVER_ZIP" \
            'https://github.com/cjber/shortest-path-forever/releases/download/v1.45.3/ShortestPathForever-v1.45.3-forever.zip'
          echo "09a54bb8ed17d4cff74211321202b4c66de180a7e9e53f5713a7ec52ff993ef9  $SHORTEST_PATH_FOREVER_ZIP" | sha256sum --check
          bash gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :dsforever:testDebugUnitTest --tests '*QuestieReplacementTest' --tests '*ExtUpdateTest' \
            --tests '*AddonsReenableTest' --tests '*PolestarGuideTest' --tests '*ThirdPartyAddonsTest' \
            --tests '*ImportedAddonsTest' --tests '*PcAddonsWantTest' --tests '*SettingsTabsTest' \
            --tests '*PerformanceTileModelTest' --tests '*GpuDriverMenuTest' \
            --tests '*QuestieStartupTest' --tests '*DependencyQuestieTest' --tests '*AddonBackupsTest' \
            --tests '*NavigationStartupTest' --tests '*SpfRouteTest' \
            --tests '*HomeLayoutRulesTest' --tests '*HomeLayoutStoreTest' --tests '*HomeEditModelTest' \
            --tests '*RealmKeyTest' --tests '*LoadGateTest' --tests '*GameVideoMemoryTest' \
            --tests '*Light8Test' --tests '*Light8UnchangedTest' --tests '*FirstRunFolderTest' \
            --tests '*CdnHttpsTest' --tests '*InstallFixesTest' --tests '*MapHoldClaimTest'
      - name: Test bundled Lua and add-on manifest
        if: ${{ !cancelled() }}
        env:
          QUESTIE_BUNDLE_ZIP: ${{ runner.temp }}/questie-bundle.zip
          SHORTEST_PATH_FOREVER_ZIP: ${{ runner.temp }}/shortest-path-forever.zip
        run: |
          python3 -m venv "$RUNNER_TEMP/lua-tests"
          "$RUNNER_TEMP/lua-tests/bin/pip" install 'lupa==2.6'
          "$RUNNER_TEMP/lua-tests/bin/python" companion/tools/test_questie_replacement.py
          "$RUNNER_TEMP/lua-tests/bin/python" -B companion/tests/test_game_fps.py
          test -s "$QUESTIE_BUNDLE_ZIP"
          test -s "$SHORTEST_PATH_FOREVER_ZIP"
          "$RUNNER_TEMP/lua-tests/bin/python" -B companion/tools/test_navigation.py -v
          "$RUNNER_TEMP/lua-tests/bin/python" -B companion/tools/test_bottom_route.py -v
          # The old HUD-switch script expects Polestar windows; Ext's Questie retirement checks replace that assumption.
          for test in test_controller_situations test_chooser_grid test_realm_key test_roombar_mirror test_combat_top_flag test_pad_order test_map_stale_pend test_aura_container; do
            "$RUNNER_TEMP/lua-tests/bin/python" -B "tools/$test.py"
          done
      - name: Restore fork signing identity
        env:
          KEYSTORE: ${{ secrets.EXT_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.EXT_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          test -n "$KEYSTORE"
          test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ext-release.p12"
      - name: Build signed APK
        env:
          WC_KEYSTORE: ${{ runner.temp }}/ext-release.p12
          WC_KEYSTORE_PASS: ${{ secrets.EXT_KEYSTORE_PASSWORD }}
          WC_KEY_ALIAS: ds-forever-ext
          WC_KEY_PASS: ${{ secrets.EXT_KEYSTORE_PASSWORD }}
        run: |
          bash gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process :app:assembleModernRelease
      - name: Verify and package release
        run: python3 tools/ci_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ds-forever-ext-apk
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-ui-screenshots
          path: ${{ runner.temp }}/ds-ext-menu-shots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            dsforever/build/test-results/
            dsforever/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ext-release.p12"
  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ds-forever-ext-apk
          path: dist
      - name: Verify release receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path('dist/BUILD.json').read_text())
          assert receipt['commit'] == os.environ['GITHUB_SHA']
          assert receipt['repository'] == os.environ['GITHUB_REPOSITORY']
          assert receipt['package'] == 'app.dsforever.ext'
          version = receipt['version']
          apk = Path('dist') / f'DS-Forever-{version}.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == receipt['sha256']
          tag = f'v{version}'
          ref = os.environ['GITHUB_REF']
          assert not ref.startswith('refs/tags/') or ref == f'refs/tags/{tag}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_TAG={tag}\n')
          PY
      - name: Upload verified APK without a local transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "DS Forever Ext $RELEASE_TAG" --notes-file RELEASE_EXT.md
